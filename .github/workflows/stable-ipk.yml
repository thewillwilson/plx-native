name: stable ipk (one-off, fork only)

on:
  push:
    branches: [stable-build]

jobs:
  stable-ipk:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/deps-cache
      - id: ndk
        uses: ./.github/actions/webos-ndk
      - name: Build
        run: make RELEASE=1 FLAVOR=stable WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}' -j"$(nproc)"
      - name: Package
        run: make ipk RELEASE=1 FLAVOR=stable WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}'
      - name: ELF assertions
        run: ./ci/check-elf.sh
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
      - name: Packaging assertions
        env:
          REQUIRE_PACKAGE: "1"
        run: python3 ci/check-package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plxnative-stable-${{ github.sha }}
          path: pkg/*.ipk
